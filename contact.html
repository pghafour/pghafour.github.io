<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me | P.Ghafour</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/style.css" />
</head>

<body>

    <!-- Header -->
    <div id="header-placeholder"></div>
    <script>
        fetch("assets/includes/header.html")
            .then(res => res.text())
            .then(data => document.getElementById("header-placeholder").innerHTML = data);
    </script>

    <!-- 3‑COLUMN LAYOUT -->
    <div class="main-container">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left">
            <div id="left-sidebar-placeholder"></div>

            <script>
                fetch("assets/includes/sidebar-left.html")
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById("left-sidebar-placeholder").innerHTML = data;

                        const current = window.location.pathname.split("/").pop();
                        const links = document.querySelectorAll(".menu-item a");

                        links.forEach(link => {
                            const page = link.getAttribute("href");
                            link.classList.remove("active-page");
                            if (page === current) {
                                link.classList.add("active-page");
                            }
                        });

                        if (current === "" || current === "index.html") {
                            document.querySelector('.menu-item a[href="index.html"]').classList.add("active-page");
                        }
                    });
            </script>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="content">
            <h2 class="page-title">Contact Me</h2>
            
            <p>You can reach me or find my academic profile via the following links:</p>

            <!-- Contact Icons Row -->
            <div class="contact-links" style="display: flex; justify-content: flex-start; gap: 20px; align-items: center; margin-top: 30px; flex-wrap: wrap;">
                
                <a href="https://www.researchgate.net/profile/Parsa-Ghafour-2" target="_blank" title="ResearchGate">
                    <img src="assets/images/researchgate.png" alt="ResearchGate" style="height: 40px;">
                </a>
                
                <a href="https://scholar.google.com/citations?user=ci0JZmcAAAAJ&hl=en" target="_blank" title="Google Scholar">
                    <img src="assets/images/googlescholar.png" alt="Google Scholar" style="height: 40px;">
                </a>
                
                <a href="https://inspirehep.net/authors/2873441" target="_blank" title="InspireHep">
                    <img src="assets/images/inspirehep.png" alt="InspireHep" style="height: 40px;">
                </a>
                
                <a href="https://www.linkedin.com/in/parsa-ghafour" target="_blank" title="LinkedIn">
                    <img src="assets/images/linkedIn_logo.png" alt="LinkedIn" style="height: 40px;">
                </a>
                
                <a href="https://orcid.org/0009-0003-2960-1563" target="_blank" title="ORCID">
                    <img src="assets/images/orcid.png" alt="ORCID" style="height: 40px;">
                </a>
                
                <a href="mailto:P.Ghafour@outlook.com" title="Email">
                    <img src="assets/images/outlook.png" alt="Email" style="height: 40px;">
                </a>

            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar-right">
            <div id="right-sidebar-placeholder"></div>

            <script>
                fetch("assets/includes/sidebar-right.html")
                    .then(res => res.text())
                    .then(data => document.getElementById("right-sidebar-placeholder").innerHTML = data);
            </script>
        </aside>

    </div>

</body>
</html>
